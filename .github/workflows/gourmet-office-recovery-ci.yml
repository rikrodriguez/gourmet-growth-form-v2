name: Gourmet Office Recovery Checks

# This workflow checks only the four explicit verification branches. It never
# publishes an image, changes another branch, connects staging or deploys.
on:
  push:
    branches:
      - codex/gourmet-office-demo-recovery-20261010
      - codex/canonical-reference-bridge-20261012
      - feat/office-communications-review-20261013
      - feat/gourmet-dashboard-reference-20261013

permissions:
  contents: read

concurrency:
  group: gourmet-office-recovery-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'rikrodriguez/gourmet-growth-form-v2' && (github.ref == 'refs/heads/codex/gourmet-office-demo-recovery-20261010' || github.ref == 'refs/heads/codex/canonical-reference-bridge-20261012' || github.ref == 'refs/heads/feat/office-communications-review-20261013' || github.ref == 'refs/heads/feat/gourmet-dashboard-reference-20261013')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      OFFICE_RUNTIME_MODE: development
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the triggering revision without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Use Node 24 without dependency cache publication
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install the lockfile-compatible Playwright Chromium
        run: |
          npx --no-install playwright install --with-deps chromium
          node --input-type=module -e "import { chromium } from '@playwright/test'; console.log('PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=' + chromium.executablePath())" >> "$GITHUB_ENV"

      - name: Check types and both builds
        run: |
          npm run typecheck
          npm run build
          npm run office:build

      - name: Check synthetic operations and shared integer calculations
        run: npm run test:operations

      - name: Start the isolated candidate PostgreSQL database
        run: npm run office:db -- start

      - name: Check office, durable PostgreSQL and staging boundaries
        run: npm run test:office

      - name: Check baseline Chromium desktop and mobile (8 cases)
        run: npm run test:e2e

      - name: Check office Chromium desktop and mobile
        run: npm run test:office:e2e

      - name: Check compiled staging authentication with isolated fixtures
        run: npm run test:staging:e2e

      - name: Check local communications review desktop and mobile (16 cases)
        run: npm run test:communications:e2e

      - name: Check approved dashboard and synthetic event flow desktop and mobile (52 cases)
        run: npm run test:dashboard:e2e

      - name: Check isolated persisted quote React HTTP PostgreSQL flow
        run: npm run test:event-quotes:e2e

      - name: Retain synthetic dashboard and event-flow screenshots for visual review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gourmet-dashboard-visual
          path: test-results/dashboard-visual/*.png
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: false

      - name: Build the local staging runtime image without publishing
        run: docker build --target runtime --tag gourmet-office-ci:checked .

      - name: Stop the isolated test database
        if: always()
        continue-on-error: true
        run: npm run office:db -- stop
