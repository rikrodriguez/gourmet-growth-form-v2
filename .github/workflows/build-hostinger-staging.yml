name: Build Hostinger Staging Artifact

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: hostinger-staging-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gourmet_growth_v2_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gourmet_growth_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run backend unit tests
        run: npm run test:unit

      - name: Create isolated CI application role
        env:
          TEST_ADMIN_DATABASE_URL: postgres://postgres@127.0.0.1:5432/gourmet_growth_v2_test
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.TEST_ADMIN_DATABASE_URL });
          await client.connect();
          await client.query('CREATE ROLE gourmet_growth_app_test LOGIN');
          await client.end();
          NODE

      - name: Apply migrations to isolated CI PostgreSQL
        env:
          MIGRATION_DATABASE_URL: postgres://postgres@127.0.0.1:5432/gourmet_growth_v2_test
          APP_DATABASE_ROLE: gourmet_growth_app_test
        run: npm run db:migrate

      - name: Run backend PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://gourmet_growth_app_test@127.0.0.1:5432/gourmet_growth_v2_test
          TEST_ADMIN_DATABASE_URL: postgres://postgres@127.0.0.1:5432/gourmet_growth_v2_test
        run: npm run test:db

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build and test secure dashboard UI
        run: |
          npm run dashboard:build
          npm run test:dashboard:e2e

      - name: Build backend service images
        run: |
          docker build --file Dockerfile.api --tag gourmet-growth-api:${GITHUB_SHA} .
          docker build --file Dockerfile.api --tag gourmet-growth-worker:${GITHUB_SHA} .
          docker build --file Dockerfile.dashboard --tag gourmet-growth-dashboard:${GITHUB_SHA} .

      - name: Run configured client delivery contracts
        env:
          VITE_GOURMET_API_BASE_URL: http://127.0.0.1:4173
          VITE_MEASUREMENT_ENVIRONMENT: staging
          E2E_API_MODE: mock
        run: |
          npm run build
          npx playwright test tests/e2e/backend-client.spec.ts --project=mobile-chromium-390x844

      - name: Run configured measurement vendor contracts
        env:
          VITE_MEASUREMENT_ENVIRONMENT: staging
          VITE_GTM_CONTAINER_ID: GTM-QATEST
          VITE_GA4_MEASUREMENT_ID: G-QATEST123
          VITE_GOOGLE_ADS_CONVERSION_ID: AW-123456789
          VITE_GOOGLE_ADS_CONVERSION_LABEL: qa-label
          VITE_CLARITY_PROJECT_ID: clarityqa
          E2E_MEASUREMENT_MODE: mock
        run: |
          npm run build
          npx playwright test tests/e2e/measurement-vendors.spec.ts --project=mobile-chromium-390x844

      - name: Run required local E2E matrix without remote writes
        run: |
          npm run build
          npm run test:e2e

      - name: Validate configured staging API QA isolation
        if: ${{ vars.VITE_GOURMET_API_BASE_URL != '' }}
        env:
          E2E_QA_SECRET: ${{ secrets.E2E_QA_SECRET }}
        run: test -n "${E2E_QA_SECRET}"

      - name: Build static frontend
        env:
          VITE_GOURMET_API_BASE_URL: ${{ vars.VITE_GOURMET_API_BASE_URL }}
          VITE_MEASUREMENT_ENVIRONMENT: staging
          VITE_GTM_CONTAINER_ID: ${{ vars.VITE_GTM_CONTAINER_ID }}
          VITE_GA4_MEASUREMENT_ID: ${{ vars.VITE_GA4_MEASUREMENT_ID }}
          VITE_GOOGLE_ADS_CONVERSION_ID: ${{ vars.VITE_GOOGLE_ADS_CONVERSION_ID }}
          VITE_GOOGLE_ADS_CONVERSION_LABEL: ${{ vars.VITE_GOOGLE_ADS_CONVERSION_LABEL }}
          VITE_CLARITY_PROJECT_ID: ${{ vars.VITE_CLARITY_PROJECT_ID }}
        run: |
          npm run typecheck
          npm run build
          node --input-type=module <<'NODE'
          import { readdirSync, writeFileSync } from 'node:fs';

          const assets = readdirSync('dist/assets')
            .filter((name) => /^index-.*\.(js|css)$/.test(name))
            .map((name) => `assets/${name}`)
            .sort();

          writeFileSync('dist/build-info.json', `${JSON.stringify({
            sourceSha: process.env.GITHUB_SHA,
            assets,
          }, null, 2)}\n`);
          NODE

      - name: Publish dist to hostinger-staging branch
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish_dir="${RUNNER_TEMP}/hostinger-publish"
          git worktree add --detach "${publish_dir}" "${GITHUB_SHA}"
          cd "${publish_dir}"
          git switch --orphan hostinger-staging-publish
          git rm -rf . || true
          cp -a "${GITHUB_WORKSPACE}/dist/." .

          git add -A
          git commit -m "deploy: staging ${GITHUB_SHA}"
          git push --force origin HEAD:hostinger-staging

      - name: Wait for exact SHA on Hostinger
        env:
          STAGING_BUILD_INFO: https://gourmet-corporation.com/form2/build-info.json
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              "${STAGING_BUILD_INFO}?sha=${GITHUB_SHA}&attempt=${attempt}" \
              --output "${RUNNER_TEMP}/live-build-info.json"; then
              if node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const info = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/live-build-info.json`, 'utf8'));
          process.exit(info.sourceSha === process.env.GITHUB_SHA ? 0 : 1);
          NODE
              then
                exit 0
              fi
            fi
            sleep 10
          done

          echo "Hostinger did not expose source SHA ${GITHUB_SHA} within 10 minutes." >&2
          exit 1

      - name: Verify live artifact references and cache policy
        env:
          STAGING_URL: https://gourmet-corporation.com/form2/bbq/
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              "${STAGING_URL}" \
              --dump-header "${RUNNER_TEMP}/live-headers.txt" \
              --output "${RUNNER_TEMP}/live-index.html"; then
              if node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const root = process.env.RUNNER_TEMP;
          const info = JSON.parse(readFileSync(`${root}/live-build-info.json`, 'utf8'));
          const html = readFileSync(`${root}/live-index.html`, 'utf8');
          const headers = readFileSync(`${root}/live-headers.txt`, 'utf8').toLowerCase();

          for (const asset of info.assets) {
            if (!html.includes(`/form2/${asset}`)) {
              throw new Error(`Live HTML does not reference expected asset: ${asset}`);
            }
          }

          if (!headers.includes('cache-control:') || !headers.includes('no-store')) {
            throw new Error('Live HTML is missing the required no-store cache policy.');
          }
          NODE
              then
                exit 0
              fi
            fi
            sleep 10
          done

          echo "Canonical staging URL did not expose the exact artifact and cache policy within 10 minutes." >&2
          exit 1

      - name: Run required E2E matrix against exact live deployment
        env:
          E2E_QA_SECRET: ${{ secrets.E2E_QA_SECRET }}
        run: npm run test:e2e:staging
