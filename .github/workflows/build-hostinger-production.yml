name: Build and Deploy Form2 Production Artifact

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source commit to build and deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_FORM2_PRODUCTION to authorize the public artifact replacement
        required: true
        type: string

concurrency:
  group: hostinger-form2-production-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_FORM2_PRODUCTION' }}
    runs-on: ubuntu-latest
    environment: production

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gourmet_growth_v2_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gourmet_growth_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}

      - name: Refuse source drift
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "${{ inputs.source_sha }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run backend unit tests
        run: npm run test:unit

      - name: Create isolated CI application role
        env:
          TEST_ADMIN_DATABASE_URL: postgres://postgres@127.0.0.1:5432/gourmet_growth_v2_test
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.TEST_ADMIN_DATABASE_URL });
          await client.connect();
          await client.query('CREATE ROLE gourmet_growth_app_test LOGIN');
          await client.end();
          NODE

      - name: Apply migrations to isolated CI PostgreSQL
        env:
          MIGRATION_DATABASE_URL: postgres://postgres@127.0.0.1:5432/gourmet_growth_v2_test
          APP_DATABASE_ROLE: gourmet_growth_app_test
        run: npm run db:migrate

      - name: Run backend PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://gourmet_growth_app_test@127.0.0.1:5432/gourmet_growth_v2_test
          TEST_ADMIN_DATABASE_URL: postgres://postgres@127.0.0.1:5432/gourmet_growth_v2_test
        run: npm run test:db

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build and test secure dashboard UI
        run: |
          npm run dashboard:build
          npm run test:dashboard:e2e

      - name: Verify production measurement contracts without customer experiments
        env:
          VITE_MEASUREMENT_ENVIRONMENT: ${{ vars.VITE_MEASUREMENT_ENVIRONMENT }}
          VITE_CUSTOMER_EXPERIMENTS_ENABLED: 'false'
          VITE_GTM_CONTAINER_ID: ${{ vars.VITE_GTM_CONTAINER_ID }}
          VITE_GA4_MEASUREMENT_ID: ${{ vars.VITE_GA4_MEASUREMENT_ID }}
          VITE_GOOGLE_ADS_CONVERSION_ID: ${{ vars.VITE_GOOGLE_ADS_CONVERSION_ID }}
          VITE_GOOGLE_ADS_CONVERSION_LABEL: ${{ vars.VITE_GOOGLE_ADS_CONVERSION_LABEL }}
          VITE_CLARITY_PROJECT_ID: ${{ vars.VITE_CLARITY_PROJECT_ID }}
          E2E_MEASUREMENT_MODE: mock
        run: |
          test "${VITE_MEASUREMENT_ENVIRONMENT}" = production
          test "${VITE_CUSTOMER_EXPERIMENTS_ENABLED}" = false
          npm run build
          E2E_EXPECTED_GTM_ID="${VITE_GTM_CONTAINER_ID}" E2E_EXPECTED_CLARITY_ID="${VITE_CLARITY_PROJECT_ID}" \
            npx playwright test tests/e2e/production-measurement-vendors.spec.ts --project=mobile-chromium-390x844
          E2E_PRODUCTION_BUILD=true npx playwright test tests/e2e/production-experiments.spec.ts --project=mobile-chromium-390x844

      - name: Build production static frontend
        env:
          VITE_GOURMET_API_BASE_URL: ${{ vars.VITE_GOURMET_API_BASE_URL }}
          VITE_MEASUREMENT_ENVIRONMENT: ${{ vars.VITE_MEASUREMENT_ENVIRONMENT }}
          VITE_CUSTOMER_EXPERIMENTS_ENABLED: 'false'
          VITE_GTM_CONTAINER_ID: ${{ vars.VITE_GTM_CONTAINER_ID }}
          VITE_GA4_MEASUREMENT_ID: ${{ vars.VITE_GA4_MEASUREMENT_ID }}
          VITE_GOOGLE_ADS_CONVERSION_ID: ${{ vars.VITE_GOOGLE_ADS_CONVERSION_ID }}
          VITE_GOOGLE_ADS_CONVERSION_LABEL: ${{ vars.VITE_GOOGLE_ADS_CONVERSION_LABEL }}
          VITE_CLARITY_PROJECT_ID: ${{ vars.VITE_CLARITY_PROJECT_ID }}
        run: |
          set -euo pipefail
          test "${VITE_MEASUREMENT_ENVIRONMENT}" = production
          test "${VITE_CUSTOMER_EXPERIMENTS_ENABLED}" = false
          test -n "${VITE_GOURMET_API_BASE_URL}"
          test -n "${VITE_GTM_CONTAINER_ID}"
          test -n "${VITE_GA4_MEASUREMENT_ID}"
          test -n "${VITE_GOOGLE_ADS_CONVERSION_ID}"
          test -n "${VITE_GOOGLE_ADS_CONVERSION_LABEL}"
          test -n "${VITE_CLARITY_PROJECT_ID}"
          npm run typecheck
          npm run build
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';

          const source = readdirSync('dist/assets')
            .filter((name) => /^index-.*\.js$/.test(name))
            .map((name) => readFileSync(`dist/assets/${name}`, 'utf8'))
            .join('\n');
          const required = [
            process.env.VITE_GTM_CONTAINER_ID,
            process.env.VITE_GA4_MEASUREMENT_ID,
            process.env.VITE_GOOGLE_ADS_CONVERSION_ID,
            process.env.VITE_GOOGLE_ADS_CONVERSION_LABEL,
            process.env.VITE_CLARITY_PROJECT_ID,
          ];
          for (const value of required) {
            if (!value || !source.includes(value)) throw new Error('Production measurement value missing from built artifact.');
          }
          for (const stagingValue of ['GTM-T9DWZ97V', 'G-TWDGBJ4NS8', 'ynvnjb3vh5']) {
            if (source.includes(stagingValue)) throw new Error(`Staging measurement value found in production artifact: ${stagingValue}`);
          }
          const assets = readdirSync('dist/assets')
            .filter((name) => /^index-.*\.(js|css)$/.test(name))
            .map((name) => `assets/${name}`)
            .sort();
          writeFileSync('dist/build-info.json', `${JSON.stringify({
            sourceSha: process.env.GITHUB_SHA,
            measurementEnvironment: 'production',
            customerExperimentsEnabled: false,
            assets,
          }, null, 2)}\n`);
          NODE

      - name: Publish reviewed production artifact to Hostinger deployment branch
        run: |
          set -euo pipefail
          # Hostinger is already wired to this generated branch at public_html/form2.
          # This isolated workflow supplies the production artifact; it does not
          # alter the Hostinger Git connection, document root, or legacy routes.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish_dir="${RUNNER_TEMP}/hostinger-production-publish"
          git worktree add --detach "${publish_dir}" "${GITHUB_SHA}"
          cd "${publish_dir}"
          git switch --orphan hostinger-production-publish
          git rm -rf . || true
          cp -a "${GITHUB_WORKSPACE}/dist/." .
          git add -A
          git commit -m "deploy: production ${GITHUB_SHA}"
          git push --force origin HEAD:hostinger-staging

      - name: Wait for exact production artifact on Hostinger
        env:
          BUILD_INFO_URL: https://gourmet-corporation.com/form2/build-info.json
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --connect-timeout 3 --max-time 5 \
              "${BUILD_INFO_URL}?sha=${GITHUB_SHA}&attempt=${attempt}" \
              --output "${RUNNER_TEMP}/live-build-info.json"; then
              if node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const info = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/live-build-info.json`, 'utf8'));
          process.exit(info.sourceSha === process.env.GITHUB_SHA
            && info.measurementEnvironment === 'production'
            && info.customerExperimentsEnabled === false ? 0 : 1);
          NODE
              then exit 0; fi
            fi
            sleep 5
          done
          echo "Hostinger did not expose the exact production artifact within 10 minutes." >&2
          exit 1

      - name: Verify live production HTML and assets
        env:
          FORM2_URL: https://gourmet-corporation.com/form2/bbq/
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 3 --max-time 10 \
            "${FORM2_URL}" --dump-header "${RUNNER_TEMP}/live-headers.txt" \
            --output "${RUNNER_TEMP}/live-index.html"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const root = process.env.RUNNER_TEMP;
          const info = JSON.parse(readFileSync(`${root}/live-build-info.json`, 'utf8'));
          const html = readFileSync(`${root}/live-index.html`, 'utf8');
          const headers = readFileSync(`${root}/live-headers.txt`, 'utf8').toLowerCase();
          for (const asset of info.assets) {
            if (!html.includes(`/form2/${asset}`)) throw new Error(`Live HTML misses expected asset: ${asset}`);
          }
          if (!headers.includes('cache-control:') || !headers.includes('no-store')) {
            throw new Error('Live HTML is missing the required no-store cache policy.');
          }
          NODE
